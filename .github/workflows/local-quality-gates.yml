name: Local-only quality gates

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop-quality:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable-x86_64-pc-windows-msvc
          components: rustfmt

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run local-only quality gates
        shell: pwsh
        run: ./scripts/check-quality-gates.ps1

      - name: Upload dependency inventory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: local-quality-cargo-metadata
          path: |
            target/quality-gates-cargo-metadata.json
            target/local-evaluation-report.json
            target/renderer-budget-report.json
          if-no-files-found: ignore
